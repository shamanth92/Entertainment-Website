apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-server
  labels:
    backendserver: movieserverbackend
spec:
  replicas: 1
  selector:
    matchLabels:
      backendserver: movieserverbackend
  template:
    metadata:
      labels:
        backendserver: movieserverbackend
    spec:
      containers:
        - name: movie-server-backend
          image: movie-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: movie-server-service
spec:
  type: NodePort
  selector:
    backendserver: movieserverbackend
  ports:
    - nodePort: 30160
      port: 5000
      targetPort: 5000
