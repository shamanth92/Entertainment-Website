name: Build and Deploy to DigitalOcean K8s

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vue-frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movie-website
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      - name: Install dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

  node-backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"

      - name: Install dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint
